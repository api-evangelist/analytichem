name: AnalytiChem
description: AnalytiChem is a global manufacturer of laboratory supplies, producing certified reference
  materials, specialized laboratory consumables, and sample-preparation systems for life sciences,
  environmental, materials, and lab-essentials markets. Its product families span ready-to-use culture
  media for microbial monitoring in pharmaceutical, food, beverage and environmental testing;
  laboratory standards for measuring heavy metals, pesticides and other contaminants; reference
  materials for the petrochemical, mining, metals and EV-battery industries; and reagents and solvents
  for chemical work and sample analysis. The company operates under ISO 17034, ISO 17025 and ISO 9001
  quality accreditations. It was surfaced as a portfolio company of Battery Ventures and added to the
  API Evangelist network. As of this enrichment pass AnalytiChem publishes no public API, developer
  portal, or machine-readable specification.
